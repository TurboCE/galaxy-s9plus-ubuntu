<meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>GPU check</title>
<style>body{font:20px sans-serif;margin:24px;background:#172124;color:#eee}canvas{max-width:100%;image-rendering:pixelated}pre{white-space:pre-wrap}</style>
<h1>GPU check</h1><canvas width="256" height="256"></canvas><pre id="result">Testing…</pre>
<script>
(async () => {
 const result = {passed:false, frames:0, mismatches:0, context_lost:false};
 const status = document.querySelector('#result');
 try {
  const canvas = document.querySelector('canvas');
  canvas.addEventListener('webglcontextlost', () => {result.context_lost=true;});
  const gl = canvas.getContext('webgl', {antialias:false, preserveDrawingBuffer:true});
  if (!gl) throw Error('WebGL unavailable');
  const debug = gl.getExtension('WEBGL_debug_renderer_info');
  result.renderer = debug ? gl.getParameter(debug.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
  if (!/Mali/i.test(result.renderer) || /llvmpipe|softpipe|SwiftShader/i.test(result.renderer)) throw Error('Physical Mali renderer required');
  function shader(type, source) {
   const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);
   if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));
   return s;
  }
  const program=gl.createProgram();
  gl.attachShader(program,shader(gl.VERTEX_SHADER,'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}'));
  gl.attachShader(program,shader(gl.FRAGMENT_SHADER,'precision highp float;uniform vec4 c;void main(){gl_FragColor=c;}'));
  gl.bindAttribLocation(program,0,'p');gl.linkProgram(program);
  if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error('Program link failed');
  gl.useProgram(program);
  const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
  gl.disable(gl.DITHER);gl.disable(gl.BLEND);
  const color=gl.getUniformLocation(program,'c');
  const output=new Uint8Array(256*256*4);
  const begin=performance.now();
  for(let frame=0;frame<120;frame++) {
   const expected=[frame*17&255,frame*37&255,frame*61&255,255];
   gl.uniform4fv(color,expected.map(x=>x/255));
   gl.drawArrays(gl.TRIANGLE_STRIP,0,4);gl.finish();
   if(frame%12===11)await new Promise(resolve=>setTimeout(resolve,180));
   gl.readPixels(0,0,256,256,gl.RGBA,gl.UNSIGNED_BYTE,output);
   for(let i=0;i<output.length;i++)if(output[i]!==expected[i%4])result.mismatches++;
   if(gl.getError()!==gl.NO_ERROR||result.context_lost)throw Error('WebGL error/context loss');
   result.frames++;
   if(result.mismatches)throw Error('Pixel mismatch');
   await new Promise(resolve=>setTimeout(resolve,16));
  }
  result.elapsed_ms=Math.round(performance.now()-begin);
  result.compared_bytes=result.frames*output.length;
  result.passed=true;
 } catch(error) {result.error=String(error);}
 status.textContent=JSON.stringify(result,null,2);
 document.title=result.passed?'GPU check passed':'GPU check failed';
 await fetch('/result',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(result)});
})();
</script>
