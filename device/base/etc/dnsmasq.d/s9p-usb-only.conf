# USB-link DHCP only. Never advertise a route or DNS that changes the host's uplink.
port=0
interface=usb0
except-interface=lo
bind-dynamic
dhcp-authoritative
dhcp-range=172.16.42.10,172.16.42.20,255.255.255.0,1h
dhcp-option=option:router
dhcp-option=option:dns-server
dhcp-leasefile=/run/s9p-usb-dhcp.leases
user=root
log-facility=-
